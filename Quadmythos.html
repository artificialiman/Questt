    <style>
        /* ── minimal, clean styles ── */
        :root {

            --ios-hover: #F8F8FA;

                --ios-bg: #000000;

                --ios-text: #FFFFFF;
                --ios-text-secondary: rgba(235, 235, 245, 0.85);

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;

            background: var(--ios-bg);

        }

            background: var(--ios-card);
            border-bottom: 0.5px solid var(--ios-separator);
            padding: calc(env(safe-area-inset-top) + 16px) 16px 16px;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 15px;
            color: var(--ios-text-tertiary);
        }

        .question-card {
            background: var(--ios-card);
            border-radius: var(--radius);
            margin: 12px 16px;
            padding: 20px;
            box-shadow: var(--shadow);
        }
        .question-number {
            font-size: 13px;
            font-weight: 600;
            color: var(--ios-blue);
            margin-bottom: 8px;
        }
        .question-text {
            font-size: 17px;

        .answer {
            font-weight: 600;

        }
        .explanation strong {
            color: var(--ios-text);
        }

        .footer-spacer {
            height: 20px;
        }

    <script>
        // ─── QUESTION DATA (copied from original, options stripped) ──
        const rawQuestions = {
            factorisation: [
                { q: "Solve x² − 5x + 6 = 0", opts: ["A. x = 2, 3", "B. x = −2, −3", "C. x = 1, 6", "D. x = −1, −6"], ans: "A", exp: "(x−2)(x−3) = 0, so x = 2 or x = 3." },
                { q: "Solve x² + 7x + 12 = 0", opts: ["A. x = −3, −4", "B. x = 3, 4", "C. x = −3, 4", "D. x = 3, −4"], ans: "A", exp: "(x+3)(x+4) = 0, so x = −3 or x = −4." },
                { q: "Solve x² − 9 = 0", opts: ["A. x = ±3", "B. x = 9", "C. x = 3 only", "D. x = −3 only"], ans: "A", exp: "Difference of two squares: (x−3)(x+3) = 0, so x = 3 or x = −3." },
                { q: "Solve x² − 16x = 0", opts: ["A. x = 0, 16", "B. x = 0, −16", "C. x = 16 only", "D. x = 0 only"], ans: "A", exp: "Take out the common factor: x(x−16) = 0, so x = 0 or x = 16." },
                { q: "Solve 2x² + 5x − 3 = 0", opts: ["A. x = 1/2, −3", "B. x = −1/2, 3", "C. x = 2, −3", "D. x = 1/2, 3"], ans: "A", exp: "Split the middle term: 2x²+6x−x−3 = 2x(x+3)−1(x+3) = (2x−1)(x+3) = 0." },
                { q: "Solve 3x² − 14x + 8 = 0", opts: ["A. x = 2/3, 4", "B. x = −2/3, 4", "C. x = 2/3, −4", "D. x = 3/2, 4"], ans: "A", exp: "3x²−12x−2x+8 = 3x(x−4)−2(x−4) = (3x−2)(x−4) = 0." },
                { q: "Solve x² − x − 12 = 0", opts: ["A. x = 4, −3", "B. x = −4, 3", "C. x = 4, 3", "D. x = −4, −3"], ans: "A", exp: "(x−4)(x+3) = 0, so x = 4 or x = −3." },
                { q: "Solve x² + 2x − 15 = 0", opts: ["A. x = −5, 3", "B. x = 5, −3", "C. x = 5, 3", "D. x = −5, −3"], ans: "A", exp: "(x+5)(x−3) = 0, so x = −5 or x = 3." },
                { q: "Solve 6x² − x − 1 = 0", opts: ["A. x = −1/3, 1/2", "B. x = 1/3, −1/2", "C. x = −1/3, −1/2", "D. x = 1/3, 1/2"], ans: "A", exp: "6x²−3x+2x−1 = 3x(2x−1)+1(2x−1) = (3x+1)(2x−1) = 0." },
                { q: "Solve x² = 4x − 4", opts: ["A. x = 2 (repeated root)", "B. x = −2 (repeated root)", "C. x = 2, −2", "D. x = 4, 0"], ans: "A", exp: "Rearrange first: x²−4x+4 = 0, which is (x−2)² = 0 — one repeated root, x = 2." },
                { q: "Solve x(x − 3) = 10", opts: ["A. x = 5, −2", "B. x = −5, 2", "C. x = 5, 2", "D. x = −5, −2"], ans: "A", exp: "Expand and rearrange: x²−3x−10 = 0, giving (x−5)(x+2) = 0." },
                { q: "Solve (x − 1)(x + 2) = 4", opts: ["A. x = −3, 2", "B. x = 3, −2", "C. x = 3, 2", "D. x = −3, −2"], ans: "A", exp: "Expand first: x²+x−2 = 4, so x²+x−6 = 0, giving (x+3)(x−2) = 0. Expanding before factorising is the step students most often skip here." },
                { q: "Find the quadratic equation whose roots are 3 and −4.", opts: ["A. x² + x − 12 = 0", "B. x² − x − 12 = 0", "C. x² + 7x − 12 = 0", "D. x² − x + 12 = 0"], ans: "A", exp: "(x−3)(x+4) = 0 expands to x²+x−12 = 0." },
                { q: "Find the quadratic equation whose roots are −2 and −5.", opts: ["A. x² + 7x + 10 = 0", "B. x² − 7x + 10 = 0", "C. x² + 7x − 10 = 0", "D. x² − 3x + 10 = 0"], ans: "A", exp: "(x+2)(x+5) = 0 expands to x²+7x+10 = 0." },
                { q: "If the roots of a quadratic equation are 1/2 and −3, find the equation.", opts: ["A. 2x² + 5x − 3 = 0", "B. 2x² − 5x − 3 = 0", "C. 2x² + 5x + 3 = 0", "D. x² + 5x − 3 = 0"], ans: "A", exp: "(2x−1)(x+3) = 0 expands to 2x²+5x−3 = 0. Clearing the fractional root into a whole-number coefficient is the reverse of splitting the middle term." },
                { q: "The sum and product of the roots of a quadratic equation are 5 and 6 respectively. Find the equation.", opts: ["A. x² − 5x + 6 = 0", "B. x² + 5x + 6 = 0", "C. x² − 6x + 5 = 0", "D. x² − 5x − 6 = 0"], ans: "A", exp: "For roots with sum S and product P, the equation is x² − Sx + P = 0." },
                { q: "The sum of the roots of x² + px + 8 = 0 is −6. Find p.", opts: ["A. 6", "B. −6", "C. 8", "D. −8"], ans: "A", exp: "Sum of roots = −p, so −p = −6, giving p = 6." },
                { q: "The product of the roots of 2x² − 7x + k = 0 is 3. Find k.", opts: ["A. 6", "B. 3", "C. 14", "D. 21/2"], ans: "A", exp: "Product of roots = k/2, so k/2 = 3, giving k = 6." },
                { q: "Solve 4x² − 1 = 0", opts: ["A. x = ±1/2", "B. x = ±1", "C. x = ±2", "D. x = 1/4"], ans: "A", exp: "(2x−1)(2x+1) = 0, so x = 1/2 or x = −1/2." },
                { q: "Solve 9x² − 12x + 4 = 0", opts: ["A. x = 2/3 (repeated root)", "B. x = −2/3", "C. x = 4/3", "D. x = 2/3, −2/3"], ans: "A", exp: "This is a perfect square trinomial: (3x−2)² = 0, giving one repeated root, x = 2/3." },
                { q: "Solve x² − 0.5x − 0.5 = 0", opts: ["A. x = −1/2, 1", "B. x = 1/2, −1", "C. x = −1/2, −1", "D. x = 1/2, 1"], ans: "A", exp: "Multiply through by 2 to clear decimals: 2x²−x−1 = 0, giving (2x+1)(x−1) = 0." },
                { q: "Solve x²/2 − 3x/2 + 1 = 0", opts: ["A. x = 1, 2", "B. x = −1, −2", "C. x = 1, −2", "D. x = −1, 2"], ans: "A", exp: "Multiply through by 2 to clear fractions: x²−3x+2 = 0, giving (x−1)(x−2) = 0." },
                { q: "Solve x⁴ − 5x² + 4 = 0", opts: ["A. x = ±1, ±2", "B. x = ±1, ±4", "C. x = 1, 4", "D. x = ±5"], ans: "A", exp: "Let y = x². Then y²−5y+4 = 0 gives (y−1)(y−4) = 0, so y = 1 or 4. Taking square roots recovers x = ±1, ±2 — four roots from one quadratic in disguise." },
                { q: "A rectangle has length (x+3) cm and width (x−1) cm. If its area is 21 cm², find x.", opts: ["A. x = 4", "B. x = −6", "C. x = 4 or −6", "D. x = 3"], ans: "A", exp: "(x+3)(x−1) = 21 gives x²+2x−24 = 0, so (x+6)(x−4) = 0. Reject x = −6, since it makes the width negative." },
                { q: "Two consecutive positive integers multiply to give 132. Find the integers.", opts: ["A. 11 and 12", "B. 10 and 13", "C. 12 and 13", "D. 9 and 14"], ans: "A", exp: "n(n+1) = 132 gives n²+n−132 = 0, so (n+12)(n−11) = 0. Reject n = −12, keeping n = 11." },
                { q: "Solve 5x² + 13x − 6 = 0", opts: ["A. x = 2/5, −3", "B. x = −2/5, 3", "C. x = 2/5, 3", "D. x = −2/5, −3"], ans: "A", exp: "5x²+15x−2x−6 = 5x(x+3)−2(x+3) = (5x−2)(x+3) = 0." },
                { q: "Solve 7x² − 6x − 1 = 0", opts: ["A. x = −1/7, 1", "B. x = 1/7, −1", "C. x = −1/7, −1", "D. x = 1/7, 1"], ans: "A", exp: "7x²−7x+x−1 = 7x(x−1)+1(x−1) = (7x+1)(x−1) = 0." },
                { q: "Solve (2x − 3)² = 25", opts: ["A. x = 4, −1", "B. x = −4, 1", "C. x = 4, 1", "D. x = −4, −1"], ans: "A", exp: "(2x−3)²−25 = 0 factors as (2x−8)(2x+2) = 0 via the difference of two squares, giving x = 4 or x = −1." },
                { q: "x² − (a+b)x + ab = 0 — what are its roots, in terms of a and b?", opts: ["A. x = a or b", "B. x = a+b", "C. x = ab", "D. x = a−b"], ans: "A", exp: "(x−a)(x−b) = 0 gives x = a or x = b. Any quadratic with roots a and b expands to this exact form — sum in the middle, product at the end." },
                { q: "Which of the following is the correct factorisation of x² − 3x − 10?", opts: ["A. (x−5)(x+2)", "B. (x+5)(x−2)", "C. (x−10)(x+1)", "D. (x−1)(x+10)"], ans: "A", exp: "(x−5)(x+2) expands to x²+2x−5x−10 = x²−3x−10. The other options expand to the wrong sign on the middle term or the wrong constant." }
            ],
            completing_square: [
                { q: "Express x² + 6x in the form (x+p)² − q.", opts: ["A. (x+3)² − 9", "B. (x+3)² + 9", "C. (x−3)² − 9", "D. (x+6)² − 9"], ans: "A", exp: "Halve the coefficient of x (6/2 = 3) to get p; q = p² = 9." },
                { q: "Express x² − 8x in the form (x−p)² − q.", opts: ["A. (x−4)² − 16", "B. (x−4)² + 16", "C. (x+4)² − 16", "D. (x−8)² − 16"], ans: "A", exp: "Half of −8 is −4, so p = 4 and q = p² = 16." },
                { q: "Express x² + 10x + 3 in completed square form.", opts: ["A. (x+5)² − 22", "B. (x+5)² + 22", "C. (x−5)² − 22", "D. (x+10)² − 22"], ans: "A", exp: "(x+5)² = x²+10x+25, so x²+10x+3 = (x+5)² − 25 + 3 = (x+5)² − 22." },
                { q: "Express x² − 4x − 5 in completed square form.", opts: ["A. (x−2)² − 9", "B. (x−2)² + 9", "C. (x+2)² − 9", "D. (x−4)² − 9"], ans: "A", exp: "(x−2)² = x²−4x+4, so x²−4x−5 = (x−2)² − 4 − 5 = (x−2)² − 9." },
                { q: "Solve x² + 6x + 5 = 0 by completing the square.", opts: ["A. x = −1, −5", "B. x = 1, 5", "C. x = −1, 5", "D. x = 1, −5"], ans: "A", exp: "(x+3)² − 9 + 5 = 0 gives (x+3)² = 4, so x+3 = ±2, meaning x = −1 or x = −5." },
                { q: "Solve x² − 4x − 12 = 0 by completing the square.", opts: ["A. x = 6, −2", "B. x = −6, 2", "C. x = 6, 2", "D. x = −6, −2"], ans: "A", exp: "(x−2)² − 4 − 12 = 0 gives (x−2)² = 16, so x−2 = ±4, meaning x = 6 or x = −2." },
                { q: "Solve x² + 2x − 8 = 0 by completing the square.", opts: ["A. x = 2, −4", "B. x = −2, 4", "C. x = 2, 4", "D. x = −2, −4"], ans: "A", exp: "(x+1)² − 1 − 8 = 0 gives (x+1)² = 9, so x+1 = ±3, meaning x = 2 or x = −4." },
                { q: "Solve x² − 10x + 21 = 0 by completing the square.", opts: ["A. x = 7, 3", "B. x = −7, −3", "C. x = 7, −3", "D. x = −7, 3"], ans: "A", exp: "(x−5)² − 25 + 21 = 0 gives (x−5)² = 4, so x = 7 or x = 3." },
                { q: "Solve 2x² + 8x − 10 = 0 by completing the square.", opts: ["A. x = 1, −5", "B. x = −1, 5", "C. x = 1, 5", "D. x = −1, −5"], ans: "A", exp: "Divide by 2 first so the leading coefficient is 1: x²+4x−5 = 0, giving (x+2)² − 4 − 5 = 0, so (x+2)² = 9 and x = 1 or −5. Skipping this division is the most common error with a non-monic equation." },
                { q: "Solve 3x² − 12x + 9 = 0 by completing the square.", opts: ["A. x = 3, 1", "B. x = −3, −1", "C. x = 3, −1", "D. x = −3, 1"], ans: "A", exp: "Divide by 3 first: x²−4x+3 = 0, giving (x−2)² − 4 + 3 = 0, so (x−2)² = 1 and x = 3 or 1." },
                { q: "Solve x² + 3x − 4 = 0 by completing the square.", opts: ["A. x = 1, −4", "B. x = −1, 4", "C. x = 1, 4", "D. x = −1, −4"], ans: "A", exp: "(x+3/2)² − 9/4 − 4 = 0 gives (x+3/2)² = 25/4, so x+3/2 = ±5/2, meaning x = 1 or −4. An odd coefficient just means p is a fraction — the method doesn't change." },
                { q: "Solve x² − 5x + 6 = 0 by completing the square.", opts: ["A. x = 3, 2", "B. x = −3, −2", "C. x = 3, −2", "D. x = −3, 2"], ans: "A", exp: "(x−5/2)² − 25/4 + 6 = 0 gives (x−5/2)² = 1/4, so x−5/2 = ±1/2, meaning x = 3 or 2." },
                { q: "Find the minimum value of y = x² − 6x + 11.", opts: ["A. 2", "B. −2", "C. 3", "D. 11"], ans: "A", exp: "Completing the square gives y = (x−3)² + 2. The minimum value, 2, occurs when the squared term is zero, at x = 3." },
                { q: "Find the minimum value of y = x² + 4x + 7.", opts: ["A. 3", "B. −3", "C. 2", "D. 7"], ans: "A", exp: "y = (x+2)² + 3, so the minimum value is 3, at x = −2." },
                { q: "Find the maximum value of y = −x² + 6x − 5.", opts: ["A. 4", "B. −4", "C. 3", "D. 5"], ans: "A", exp: "Factor out −1 first, since the leading coefficient is negative: y = −(x²−6x)−5 = −[(x−3)²−9]−5 = −(x−3)²+4. The parabola opens downward, so this is a maximum: 4, at x = 3." },
                { q: "Find the maximum value of y = −x² + 2x + 8.", opts: ["A. 9", "B. −9", "C. 1", "D. 8"], ans: "A", exp: "y = −(x²−2x)+8 = −[(x−1)²−1]+8 = −(x−1)²+9. Maximum value 9, at x = 1." },
                { q: "Find the coordinates of the turning point of y = x² − 8x + 15.", opts: ["A. (4, −1)", "B. (−4, −1)", "C. (4, 1)", "D. (−4, 1)"], ans: "A", exp: "y = (x−4)² − 1, so the vertex is at (4, −1)." },
                { q: "Find the coordinates of the turning point of y = x² + 4x − 1.", opts: ["A. (−2, −5)", "B. (2, −5)", "C. (−2, 5)", "D. (2, 5)"], ans: "A", exp: "y = (x+2)² − 5, so the vertex is at (−2, −5)." },
                { q: "For what value of x does y = 2x² − 8x + 3 have its minimum value?", opts: ["A. x = 2", "B. x = −2", "C. x = 4", "D. x = 8"], ans: "A", exp: "y = 2(x²−4x)+3 = 2[(x−2)²−4]+3 = 2(x−2)²−5. Minimum occurs at x = 2 — factoring out the leading coefficient first doesn't change where the vertex sits, only its depth." },
                { q: "Deriving the quadratic formula from ax² + bx + c = 0 by completing the square, what expression appears under the square root?", opts: ["A. b² − 4ac", "B. b² + 4ac", "C. 4ac − b²", "D. b² − 2ac"], ans: "A", exp: "Dividing by a and completing the square on x²+(b/a)x produces x = [−b ± √(b²−4ac)] / 2a. The discriminant b²−4ac falls directly out of this process — it isn't a separate rule to memorise." },
                { q: "Using x² + bx + c = 0 → x = −b/2 ± √(b²/4 − c), what does the term under the root become when b = 6, c = 5?", opts: ["A. 4", "B. 9", "C. 5", "D. 6"], ans: "A", exp: "b²/4 − c = 36/4 − 5 = 9 − 5 = 4. This reproduces the earlier result (x+3)² = 4 for x²+6x+5=0 by the general formula rather than the step-by-step method." },
                { q: "Solve x² + x − 1 = 0 by completing the square, giving your answer in surd form.", opts: ["A. x = (−1 ± √5)/2", "B. x = (1 ± √5)/2", "C. x = (−1 ± √5)/4", "D. x = −1 ± √5"], ans: "A", exp: "(x+1/2)² − 1/4 − 1 = 0 gives (x+1/2)² = 5/4, so x = −1/2 ± √5/2 = (−1 ± √5)/2. When the completed-square value isn't a perfect square, leave the answer as a surd rather than forcing a decimal." },
                { q: "Solve x² − 4x + 1 = 0 by completing the square, giving your answer in surd form.", opts: ["A. x = 2 ± √3", "B. x = 2 ± √4", "C. x = 4 ± √3", "D. x = −2 ± √3"], ans: "A", exp: "(x−2)² − 4 + 1 = 0 gives (x−2)² = 3, so x = 2 ± √3." },
                { q: "For x² + 2x + 5 = 0, completing the square gives (x+1)² = −4. What does this indicate about the roots?", opts: ["A. No real roots exist — the roots are complex", "B. Two equal real roots", "C. Two distinct real roots", "D. One root is zero"], ans: "A", exp: "A real number squared can never equal a negative number, so (x+1)² = −4 has no real solution. This is the same conclusion the discriminant test (b²−4ac < 0) gives, reached by a different route." },
                { q: "For x² − 6x + 9 = 0, completing the square gives (x−3)² = 0. What does this indicate?", opts: ["A. One repeated real root, x = 3", "B. Two distinct real roots", "C. No real roots", "D. Two roots, x = 0 and x = 6"], ans: "A", exp: "(x−3)² = 0 has only one solution, x = 3, counted as a repeated (equal) root." },
                { q: "A rectangular field of area 40 m² has width x metres and length (x+3) metres. Use completing the square on x²+3x−40=0 to find x.", opts: ["A. x = 5", "B. x = −8", "C. x = 5 or −8", "D. x = 8"], ans: "A", exp: "(x+3/2)² − 9/4 − 40 = 0 gives (x+3/2)² = 169/4, so x = 5 or x = −8. Reject the negative root — a width of −8 m has no physical meaning." },
                { q: "A ball's height is h = −5t² + 20t (t in seconds). Use completing the square to find the maximum height and when it occurs.", opts: ["A. 20 m at t = 2 s", "B. 20 m at t = 4 s", "C. 4 m at t = 2 s", "D. 25 m at t = 2 s"], ans: "A", exp: "Factor out −5 first: h = −5(t²−4t) = −5[(t−2)²−4] = −5(t−2)²+20. Maximum height 20 m, at t = 2 s." },
                { q: "Express 2x² − 4x + 7 in the form a(x−h)² + k.", opts: ["A. 2(x−1)² + 5", "B. 2(x−1)² + 7", "C. 2(x+1)² + 5", "D. 2(x−2)² + 5"], ans: "A", exp: "2(x²−2x)+7 = 2[(x−1)²−1]+7 = 2(x−1)²−2+7 = 2(x−1)²+5." },
                { q: "Given x² − 8x + k = (x−4)² for some constant k, find k.", opts: ["A. 16", "B. 8", "C. 4", "D. 64"], ans: "A", exp: "(x−4)² = x²−8x+16, so k = 16. The constant that completes the square is always (half the x-coefficient)²." },
                { q: "A student writes x² − 7x + 10 as (x − 7/2)² − 49/4 + 10. What is the simplified constant term?", opts: ["A. −9/4", "B. 9/4", "C. −49/4", "D. 51/4"], ans: "A", exp: "Convert 10 to quarters before combining: −49/4 + 40/4 = −9/4. Forgetting to convert to a common denominator is the usual slip when the x-coefficient is odd." }
            ]
        };

        // ─── combine & extract answer text ───────────────────────────
        function getAnswerText(q) {
            const opt = q.opts.find(o => o.startsWith(q.ans + '.'));
            return opt ? opt.substring(opt.indexOf(' ') + 1) : q.ans;
        }

        const allQuestions = [
            ...rawQuestions.factorisation,
            ...rawQuestions.completing_square
        ];

        // ─── render ──────────────────────────────────────────────────
        const container = document.getElementById('questions-container');

        let html = '';
        allQuestions.forEach((q, i) => {
            const answerText = getAnswerText(q);
            html += `
                <div class="question-card">
                    <div class="question-number">Q${i + 1}</div>
                    <div class="question-text">${q.q}</div>
                    <div class="answer">✔ Answer: ${answerText}</div>
                    <div class="explanation"><strong>Explanation:</strong> ${q.exp}</div>
                </div>
            `;
        });

        container.innerHTML = html;
    </script>
</body>
</html>
